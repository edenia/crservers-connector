apiVersion: v1
kind: ConfigMap
metadata:
  name: connector-config
data:
  PORT: '8080'
  PUBLIC_URL: 'https://${INGRESS_HOST}'
  CLIENT_AREA_URL: '${CLIENT_AREA_URL}'
  EXTRA_REDIRECT_URIS: '${EXTRA_REDIRECT_URIS}'
  VERSION: '${VERSION}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: connector
  labels: { app: connector }
spec:
  # One replica until the per-site publish lock moves to Postgres; Recreate so two pods never overlap.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: connector }
  template:
    metadata:
      labels: { app: connector }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: connector
          image: ${IMAGE}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: connector-config }
            - secretRef: { name: connector-secrets }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: '1', memory: 768Mi }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: connector
spec:
  selector: { app: connector }
  ports:
    - port: 8080
      targetPort: 8080
