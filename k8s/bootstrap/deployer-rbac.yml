# One-time, applied by a cluster admin. Gives CI a deploy identity that can only touch
# the crservers-connector namespace. Apply storageclass.yml in the same step.
apiVersion: v1
kind: Namespace
metadata:
  name: crservers-connector
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: connector-deployer
  namespace: crservers-connector
---
apiVersion: v1
kind: Secret
metadata:
  name: connector-deployer-token
  namespace: crservers-connector
  annotations:
    kubernetes.io/service-account.name: connector-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: connector-deployer
  namespace: crservers-connector
rules:
  - apiGroups: ['']
    resources: [configmaps, secrets, services, pods, pods/log, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [traefik.containo.us]
    resources: [ingressroutes, middlewares]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: connector-deployer
  namespace: crservers-connector
subjects:
  - kind: ServiceAccount
    name: connector-deployer
    namespace: crservers-connector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: connector-deployer
