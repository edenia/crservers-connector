# One-time per environment, applied by a cluster admin. Gives CI a deploy identity that can
# only touch one namespace. Apply storageclass.yml in the same step (once per cluster).
#   NAMESPACE=crservers-connector envsubst '${NAMESPACE}' < deployer-rbac.yml | kubectl apply -f -
apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: connector-deployer
  namespace: ${NAMESPACE}
---
apiVersion: v1
kind: Secret
metadata:
  name: connector-deployer-token
  namespace: ${NAMESPACE}
  annotations:
    kubernetes.io/service-account.name: connector-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: connector-deployer
  namespace: ${NAMESPACE}
rules:
  - apiGroups: ['']
    resources: [configmaps, secrets, services, pods, pods/log, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [traefik.io]
    resources: [ingressroutes, middlewares]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: connector-deployer
  namespace: ${NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: connector-deployer
    namespace: ${NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: connector-deployer
