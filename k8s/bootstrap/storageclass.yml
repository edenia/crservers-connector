# Cluster-scoped, applied once by an admin (bootstrap). Two Longhorn replicas: this volume holds clients' undo history.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: crservers-connector-storage
provisioner: driver.longhorn.io
parameters:
  numberOfReplicas: '2'
  staleReplicaTimeout: '2880'
  fromBackup: ''
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
