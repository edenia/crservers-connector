apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app: connector-postgres }
spec:
  clusterIP: None
  selector: { app: connector-postgres }
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: connector-postgres
  labels: { app: connector-postgres }
spec:
  serviceName: postgres
  replicas: 1
  # Never put the release version in the selector: it is immutable.
  selector:
    matchLabels: { app: connector-postgres }
  template:
    metadata:
      labels: { app: connector-postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          env:
            - { name: POSTGRES_USER, value: connector }
            - { name: POSTGRES_DB, value: connector }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: connector-postgres, key: POSTGRES_PASSWORD } }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec: { command: [pg_isready, -U, connector, -d, connector] }
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: crservers-connector-storage
        resources:
          requests: { storage: 10Gi }
